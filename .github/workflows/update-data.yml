name: Update Stock Data

on:
  schedule:
    # Jalankan setiap hari jam 09:00 UTC (sekitar jam 16:00 WIB, setelah market AS buka)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Bisa juga dijalankan manual

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
      
      - name: Run Python Engine
        run: |
          cd engine
          python main.py
      
      - name: Commit and push data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/data.json
          git diff --staged --quiet || git commit -m "📊 Auto-update: data saham $(date +'%Y-%m-%d %H:%M UTC')"
          git push
