name: Perbarui Data Saham

on:
  # Jalankan otomatis setiap hari pukul 09.00 WIB (01:00 UTC)
  schedule:
    - cron: '0 1 * * *'
  # Izinkan jalankan manual dari halaman GitHub
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Kode
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Jalankan Analisa
        run: |
          cd py-engine
          python analisa_saham.py

      - name: 📝 Commit & Push Hasil
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add output/hasil_analisa.json
          git commit -m "🤖 Update data: $(date +'%Y-%m-%d %H:%M:%S')" || echo "Tidak ada perubahan"
          git push
